name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e code/
          pip install pytest pytest-cov ruff mypy
      - name: Lint
        run: ruff check code/ tests/ benchmarks/
      - name: Types
        run: mypy code/src/slm_decision --ignore-missing-imports
      - name: Tests
        run: pytest tests/ -q --cov=slm_decision --cov-report=term-missing

  quality-gate:
    name: decision quality gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e code/
      - name: Evaluate
        run: python benchmarks/evaluate.py --out eval.json
      - name: Gate
        run: python benchmarks/gate.py eval.json --baseline benchmarks/baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval.json

  notebooks:
    name: execute notebooks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e code/
          pip install nbconvert jupyter matplotlib
      - name: Execute
        run: |
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute "$nb" --output-dir /tmp/nb --ExecutePreprocessor.timeout=600
          done
